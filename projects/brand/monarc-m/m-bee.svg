<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A9BFF"/>
      <stop offset="1" stop-color="#0A5FE0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/></clipPath>
  </defs>

  <!-- squircle ground -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#gloss)"/>

  <!-- the M -->
  <path d="M272 730 V330 L512 610 L752 330 V730" fill="none" stroke="#FFFFFF" stroke-width="98" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- flight trail -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="700" cy="248" r="7"/>
    <circle cx="734" cy="222" r="8"/>
    <circle cx="772" cy="204" r="9"/>
  </g>

  <!-- bee -->
  <g transform="translate(836 190) rotate(-18) scale(1.3)">
    <!-- wings -->
    <ellipse cx="-16" cy="-48" rx="28" ry="17" fill="#FFFFFF" opacity="0.95" transform="rotate(-28 -16 -48)"/>
    <ellipse cx="22" cy="-50" rx="28" ry="17" fill="#FFFFFF" opacity="0.95" transform="rotate(24 22 -50)"/>
    <!-- body -->
    <ellipse cx="0" cy="0" rx="58" ry="38" fill="#FFFFFF"/>
    <!-- stripes -->
    <g clip-path="url(#bee)">
      <clipPath id="bee"><ellipse cx="0" cy="0" rx="58" ry="38"/></clipPath>
      <rect x="-30" y="-40" width="16" height="80" fill="#0A5FE0"/>
      <rect x="2" y="-40" width="16" height="80" fill="#0A5FE0"/>
      <rect x="34" y="-40" width="14" height="80" fill="#0A5FE0"/>
    </g>
    <!-- head -->
    <circle cx="-68" cy="-4" r="22" fill="#FFFFFF"/>
    <!-- antennae -->
    <path d="M-78 -22 Q-96 -46 -110 -44 M-64 -24 Q-70 -50 -84 -60" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <!-- stinger -->
    <path d="M56 6 L78 12 L56 18 Z" fill="#FFFFFF"/>
  </g>
</svg>
