<!-- Section template: logo banner. Added 2026-09-25 from Jonathan's screenshot ("National Citations We Work With").

     under a hero). The page must link site.css.
     Logos: public_html/assets/logos/*.svg (Wikimedia Commons files, 2026-09-25). Every img carries alt text (Media 5).
     The second set is a copy for the seamless loop and is hidden from screen readers.
     Full color (Jonathan, 2026-09-26: "logos for brand recognition are full color"; Style Guide Media 6).
     Label "We list your business on" (Jonathan, 2026-09-28): it claims no partnership. Never "We work with" (Style Guide

     <!-- logo-banner --> marker; this file is the hand copy for pages that are not built (/av_marketing/, where the label

     Ad pages: no links on the logos (Style Guide 6.1). Paths below assume the page sits one folder down. -->
