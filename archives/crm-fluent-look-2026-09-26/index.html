<!DOCTYPE html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monarc CRM</title>
<meta name="theme-color" content="#0F6CBD">
<!-- Styled like a Microsoft product (Fluent look) and reorganized around a left rail, Jonathan 2026-09-23.
     Work: Today, Pipeline (bookings from the page become deals on the board). Records: Companies, Activity.
     Performance: Channels, Reports, Money. Settings at the foot.
     Segoe UI is on the machine, so no web fonts. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside class="rail">
  <a class="brand" href="#/today"><span class="mark" aria-hidden="true">M</span><span>Monarc CRM</span></a>
  <div class="vert" id="vert" role="radiogroup" aria-label="Vertical"></div>
  <nav class="nav" id="nav" aria-label="Sections">
    <div class="rail-group">
      <div class="label">Work</div>
      <a href="#/today" data-route="today" title="Today"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="13" rx="1.5"/><path d="M3 8h14M7 2.5v3M13 2.5v3M6.5 12h3"/></svg><span>Today</span></a>
      <a href="#/pipeline" data-route="pipeline" title="Pipeline"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="4" height="14" rx="1"/><rect x="8" y="3" width="4" height="9" rx="1"/><rect x="13.5" y="3" width="4" height="11" rx="1"/></svg><span>Pipeline</span></a>
    </div>
    <div class="rail-group">
      <div class="label">Records</div>
      <a href="#/companies" data-route="companies" title="Companies"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V4.5A1.5 1.5 0 0 1 4.5 3h6A1.5 1.5 0 0 1 12 4.5V17M12 8h3.5A1.5 1.5 0 0 1 17 9.5V17M2 17h16M6 7h3M6 10h3M6 13h3"/></svg><span>Companies</span></a>
      <a href="#/activity" data-route="activity" title="Activity"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 1.5"/></svg><span>Activity</span></a>
    </div>
    <div class="rail-group">
      <div class="label">Performance</div>
      <a href="#/channels" data-route="channels" title="Channels"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2"/><path d="M6.5 6.5a5 5 0 0 0 0 7M13.5 6.5a5 5 0 0 1 0 7M4 4a8.5 8.5 0 0 0 0 12M16 4a8.5 8.5 0 0 1 0 12"/></svg><span>Channels</span></a>
      <a href="#/reports" data-route="reports" title="Reports"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h14M5 14V9M9 14V5M13 14v-3M17 14V7"/></svg><span>Reports</span></a>
      <a href="#/money" data-route="money" title="Money"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="15" height="10" rx="1.5"/><circle cx="10" cy="10" r="2.2"/><path d="M5.5 8v4M14.5 8v4"/></svg><span>Money</span></a>
    </div>
    <div class="rail-group rail-bottom">
      <a href="#/settings" data-route="settings" title="Settings"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg><span>Settings</span></a>
    </div>
  </nav>
  <div class="status" id="status"><span class="dot"></span><span id="status-text">Connecting</span></div>
</aside>
<main id="view" class="view"></main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
